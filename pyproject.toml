[project]
name = "payment-fraud-risk"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "pydantic>=2,<3", "pandas>=2.2,<3", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "lightgbm>=4,<5", "shap>=0.46,<1", "joblib>=1.4,<2", "httpx>=0.27,<1", "streamlit>=1.40,<2", "plotly>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "training*", "service*", "dashboard*", "simulator*"]
